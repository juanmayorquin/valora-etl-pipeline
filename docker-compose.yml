# Todo el entorno se levanta desde acá. Las variables salen de `.env` (copiá
# `.env.example`); si no existe, valen los defaults `${VAR:-valor}` de este archivo, que
# alcanzan para desarrollo local.
#
#   docker compose up -d                       # lakehouse (MinIO + ClickHouse)
#   docker compose run --rm reprocesar         # raw versionado -> modelo, sin scrapear
#   docker compose run --rm pipeline           # las seis etapas, scraping incluido
#   docker compose up -d web                   # la interfaz web en localhost:8000
#   docker compose --profile notebooks up -d   # Jupyter en localhost:8888

# Configuración común de las etapas: misma imagen, mismos volúmenes.
x-etl: &etl
  build:
    context: .
    target: pipeline
  image: valora-etl:pipeline
  environment:
    HEADLESS: "true"
  volumes:
    - ./data:/app/data
    - ./models:/app/models

# Credenciales y endpoints del lakehouse, para las etapas que le hablan (load, train).
x-lakehouse: &lakehouse
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-valora}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-valora123}
  MINIO_BUCKET: ${MINIO_BUCKET:-valora}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-valora}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-valora123}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-valora}

x-necesita-lakehouse: &necesita-lakehouse
  minio:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  # =============================== Lakehouse ===============================
  # MinIO es el LAGO y la fuente de verdad: guarda las tres capas en Parquet y los
  # artefactos del modelo. ClickHouse es el WAREHOUSE: copia el gold a una tabla
  # MergeTree para consultar rápido. La data queda en dos lugares a propósito: el lago
  # siempre se puede reprocesar.
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-valora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-valora123}
    ports:
      - "${MINIO_PORT:-9000}:9000"           # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Contenedor efímero: crea el bucket y se apaga. `--ignore-existing` lo hace
  # idempotente, así que puede correr en cada `up`.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-valora}" "${MINIO_ROOT_PASSWORD:-valora123}" &&
        mc mb --ignore-existing "local/${MINIO_BUCKET:-valora}" &&
        echo "bucket ${MINIO_BUCKET:-valora} listo"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-valora}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-valora123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-valora}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"     # HTTP, por donde entra src/load.py
      - "${CLICKHOUSE_NATIVE_PORT:-9002}:9000"   # nativo. 9000 en el host es de MinIO
    volumes:
      - chdata:/var/lib/clickhouse
    # ClickHouse abre muchísimos descriptores y, sin techo, se queda con toda la RAM que
    # encuentre. 2 GB le sobran para 50.000 filas y dejan la máquina usable.
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # =============================== Etapas ==================================
  # Etapa 1 - Extract:  docker compose run --rm scraper
  # Horas: son seis barridos (3 tipos x 2 operaciones) contra el sitio con Chromium.
  # Es el único servicio que usa el target `scraper` de la imagen.
  scraper:
    <<: *etl
    build:
      context: .
      target: scraper
    image: valora-etl:scraper
    command: python src/extract.py --snapshot

  # Etapa 2 - Detail:  docker compose run --rm detail
  # Visita el detalle de cada anuncio por HTTP plano (sin navegador) y saca el JSON
  # embebido: coordenadas, estrato, antigüedad, administración, comodidades...
  # ~1 hora la primera vez; reanudable, así que un corte no cuesta la corrida.
  detail:
    <<: *etl
    command: python src/detail.py --hilos ${HILOS_DETALLE:-8}

  # Etapa 3 - Transform:  docker compose run --rm transform
  # Segundos: cruza raw + detalle, aplica las reglas de calidad y escribe los stages
  # limpio y cuarentena en data/processed/. Sale con 1 si alguna validación falla.
  transform:
    <<: *etl
    command: python src/transform.py

  # Etapa 4 - Enrich:  docker compose run --rm enrich
  # Completa la coordenada de los anuncios que no la traen con la mediana de los otros
  # anuncios del mismo sector y calcula la distancia al centro. Segundos, sin red.
  enrich:
    <<: *etl
    command: python src/enrich.py

  # Etapa 5 - Load:  docker compose run --rm load
  # Sube las tres capas a MinIO y puebla ClickHouse leyendo el gold desde el lago.
  # Idempotente: re-correr el mismo día sobrescribe la partición, no duplica filas.
  load:
    <<: *etl
    environment:
      <<: *lakehouse
    depends_on: *necesita-lakehouse
    command: python src/load.py

  # Etapa 6 - Train:  docker compose run --rm train
  # Entrena los modelos de arriendo y venta, los evalúa con split agrupado y deja el
  # artefacto en models/ y en el lago. Sale con 1 si no pasa la compuerta de R².
  train:
    <<: *etl
    environment:
      <<: *lakehouse
    depends_on: *necesita-lakehouse
    command: python src/train.py

  # Pipeline completo en una sola invocación:  docker compose run --rm pipeline
  # El `&&` importa: cada etapa consume lo que dejó la anterior, y no tiene sentido
  # seguir con datos viejos si una falla.
  pipeline:
    <<: *etl
    build:
      context: .
      target: scraper
    image: valora-etl:scraper
    environment:
      <<: *lakehouse
    depends_on: *necesita-lakehouse
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python src/extract.py --snapshot
        && python src/detail.py --hilos ${HILOS_DETALLE:-8}
        && python src/transform.py && python src/enrich.py
        && python src/load.py && python src/train.py

  # El camino corto:  docker compose run --rm reprocesar
  # Arranca desde lo que ya está versionado en data/raw/ (los CSV del extract y el
  # detalle.parquet) y llega hasta el modelo sin tocar el sitio. Es lo que corre un clon
  # nuevo para tener el lakehouse poblado y el sandbox andando en minutos.
  reprocesar:
    <<: *etl
    environment:
      <<: *lakehouse
    depends_on: *necesita-lakehouse
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python src/transform.py && python src/enrich.py
        && python src/load.py && python src/train.py

  # Ejecución periódica del pipeline completo:
  #   docker compose --profile periodico up -d pipeline-periodico
  # Alternativa si preferís el planificador del sistema: llamar a `pipeline` desde cron
  # o el Programador de tareas de Windows.
  pipeline-periodico:
    <<: *etl
    build:
      context: .
      target: scraper
    image: valora-etl:scraper
    profiles: ["periodico"]
    restart: unless-stopped
    environment:
      <<: *lakehouse
      HEADLESS: "true"
      INTERVALO_HORAS: ${INTERVALO_HORAS:-24}
      HILOS_DETALLE: ${HILOS_DETALLE:-8}
    depends_on: *necesita-lakehouse
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] iniciando pipeline"
          python src/extract.py --snapshot \
            && python src/detail.py --hilos "$${HILOS_DETALLE}" \
            && python src/transform.py \
            && python src/enrich.py \
            && python src/load.py \
            && python src/train.py \
            || echo "pipeline interrumpido en una etapa (exit $$?); se reintenta en el proximo ciclo"
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] durmiendo $${INTERVALO_HORAS}h"
          sleep $$(( $${INTERVALO_HORAS} * 3600 ))
        done

  # =============================== Interfaz web ============================
  # La página para valuar un inmueble y compararlo con su zona:  docker compose up -d web
  # Usa el modelo versionado en models/ y el gold de data/processed/. Si el gold no existe
  # todavía (clon nuevo sin reprocesar), primero `docker compose run --rm reprocesar`.
  web:
    <<: *etl
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./web:/app/web
      - ./frontend:/app/frontend
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ciudades', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # =============================== Notebooks ===============================
  # Jupyter Lab con todo instalado:  docker compose --profile notebooks up -d
  # Abre http://localhost:8888 (token en .env, por defecto `valora`). Los notebooks, la
  # data y los modelos son volúmenes: lo que guardás queda en tu disco.
  jupyter:
    build:
      context: .
      target: notebooks
    image: valora-etl:notebooks
    profiles: ["notebooks"]
    restart: unless-stopped
    environment:
      <<: *lakehouse
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-valora}
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src

volumes:
  miniodata:
  chdata:
