services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpa
      POSTGRES_PASSWORD: gpa
      POSTGRES_DB: metrocuadrado
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpa -d metrocuadrado"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HEADLESS: "true"
      DATABASE_URL: postgresql://gpa:gpa@db:5432/metrocuadrado
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
