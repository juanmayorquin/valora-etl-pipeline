# Configuración común de las etapas del ETL: misma imagen, mismo volumen de datos.
# El ancla evita repetirla y que se desincronicen entre servicios.
x-etl: &etl
  build: .
  image: valora-etl:latest
  environment:
    HEADLESS: "true"
  volumes:
    - ./data:/app/data

# Credenciales y endpoints del lakehouse. Sólo la etapa de carga los necesita, así que van
# en un ancla aparte en vez de ensuciar el entorno de las otras tres.
# Son credenciales de desarrollo local, obviamente: en un despliegue real salen de secretos.
x-lakehouse: &lakehouse
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: valora
  MINIO_SECRET_KEY: valora123
  MINIO_BUCKET: valora
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: valora
  CLICKHOUSE_PASSWORD: valora123
  CLICKHOUSE_DB: valora

services:
  # ─────────────────────────────── Lakehouse ───────────────────────────────
  # MinIO es el LAGO y la fuente de verdad: guarda las tres capas en Parquet.
  # ClickHouse es el WAREHOUSE: copia el gold a tablas MergeTree para consultar rápido.
  # La data queda en dos lugares a propósito - el lago siempre se puede reprocesar.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: valora
      MINIO_ROOT_PASSWORD: valora123
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Contenedor efímero: crea el bucket y los prefijos de las tres capas, y se apaga.
  # `--ignore-existing` lo hace idempotente, así que puede correr en cada `up`.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 valora valora123 &&
        mc mb --ignore-existing local/valora &&
        echo "bucket valora listo"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: valora
      CLICKHOUSE_PASSWORD: valora123
      CLICKHOUSE_DB: valora
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP, que es por donde entra src/load.py
      - "9002:9000"   # protocolo nativo. 9000 en el host ya lo tomó MinIO.
    volumes:
      - chdata:/var/lib/clickhouse
    # ClickHouse abre muchísimos descriptores y, sin techo, se queda con toda la RAM que
    # encuentre. 2 GB le sobran para 45.000 filas y dejan la máquina usable.
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ─────────────────────────────── Etapas ETL ───────────────────────────────
  # Etapa 1 - Extract:  docker compose run --rm scraper
  # Tarda horas: son seis barridos (3 tipos x 2 operaciones) contra el sitio real.
  scraper:
    <<: *etl
    command: python src/extract.py --snapshot

  # Etapa 2 - Transform:  docker compose run --rm transform
  # Segundos, no horas: lee los CSV que dejó el extract en data/raw/ y escribe los dos
  # stages en data/processed/. Sale con código 1 si alguna validación falla.
  transform:
    <<: *etl
    command: python src/transform.py

  # Etapa 3 - Enrich:  docker compose run --rm enrich
  # Agrega el contexto del barrio (coordenadas y estrato) al stage limpio.
  # La primera corrida tarda: son cientos de requests a OpenStreetMap y ArcGIS. Todas
  # las respuestas quedan cacheadas en data/external/, así que la segunda es instantánea
  # y una corrida interrumpida retoma donde quedó.
  enrich:
    <<: *etl
    command: python src/enrich.py

  # Etapa 4 - Load:  docker compose run --rm load
  # Sube las tres capas a MinIO y puebla ClickHouse leyendo el gold desde el lago.
  # Idempotente: re-correr el mismo día sobrescribe la partición, no duplica filas.
  load:
    <<: *etl
    environment:
      <<: *lakehouse
    depends_on:
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command: python src/load.py

  # Pipeline completo (extract -> transform -> enrich -> load) en una sola invocación:
  #   docker compose run --rm pipeline
  # El `&&` importa: cada etapa consume lo que dejó la anterior, y no tiene sentido
  # seguir con datos viejos si una falla.
  pipeline:
    <<: *etl
    environment:
      <<: *lakehouse
    depends_on:
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python src/extract.py --snapshot && python src/transform.py
        && python src/enrich.py && python src/load.py

  # Ejecución periódica del pipeline completo, con intervalo configurable:
  #   docker compose --profile periodico up -d pipeline-periodico
  # Alternativa si preferís el planificador del sistema: dejar sólo el servicio
  # `pipeline` y llamarlo desde cron o el Programador de tareas de Windows.
  pipeline-periodico:
    <<: *etl
    profiles: ["periodico"]
    restart: unless-stopped
    environment:
      <<: *lakehouse
      HEADLESS: "true"
      INTERVALO_HORAS: "24"
    depends_on:
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] iniciando pipeline"
          if python src/extract.py --snapshot; then
            if python src/transform.py; then
              if python src/enrich.py; then
                python src/load.py || echo "carga fallida (exit $$?)"
              else
                echo "enriquecimiento fallido (exit $$?), se omite la carga"
              fi
            else
              echo "transformacion fallida (exit $$?), se omite el enriquecimiento"
            fi
          else
            echo "extraccion fallida (exit $$?), se omite la transformacion"
          fi
          echo "[$$(date -u +%Y-%m-%dT%H:%M:%SZ)] durmiendo $${INTERVALO_HORAS}h"
          sleep $$(( $${INTERVALO_HORAS} * 3600 ))
        done

volumes:
  miniodata:
  chdata:
