<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Brand Name Typography -->
  <!-- "VAL" in deep navy -->
  <text x="8" y="60" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="64" fill="#142B3A" letter-spacing="-1.5">VAL</text>
  
  <!-- Isotype as "O" (centered at X=168, Y=40, radius ~28) -->
  <g transform="translate(136, 6) scale(0.68)">
    <!-- Outer Arch -->
    <path d="M 20 74 A 38 38 0 0 1 80 74" stroke="#176B45" stroke-width="10" stroke-linecap="round" fill="none" />
    
    <!-- Chimney -->
    <rect x="58" y="36" width="6.5" height="14" fill="#176B45" rx="1.5" />
    
    <!-- House Roof -->
    <path d="M 27 62 L 50 42 L 73 62" stroke="#176B45" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- House Body -->
    <path d="M 37 62 L 37 77 L 63 77 L 63 62 Z" fill="#176B45" />
    
    <!-- 4-Pane Window -->
    <rect x="43" y="64" width="5" height="5" fill="#FFFFFF" rx="0.6" />
    <rect x="51.5" y="64" width="5" height="5" fill="#FFFFFF" rx="0.6" />
    <rect x="43" y="70.5" width="5" height="5" fill="#FFFFFF" rx="0.6" />
    <rect x="51.5" y="70.5" width="5" height="5" fill="#FFFFFF" rx="0.6" />
  </g>
  
  <!-- "RA" in deep navy -->
  <text x="212" y="60" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="64" fill="#142B3A" letter-spacing="-1.5">RA</text>
</svg>
